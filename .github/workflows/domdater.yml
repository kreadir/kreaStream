name: Domain Updater

on:
  schedule:
    - cron: '0/45 * * * *'
  workflow_dispatch:

env:
  FILE_PATH: domain_test
  BLACKLIST_PATH: domain_direct
  TZ: Europe/Istanbul

jobs:
  domain-kontrolu:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu klonla
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Gerekli paketleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests cloudscraper

      - name: Domainleri kontrol et ve güncelle
        run: |
          python - <<'EOF'
          import re
          import os
          from urllib.parse import urlparse
          from cloudscraper import CloudScraper

          scraper = CloudScraper()

          def load_blacklist(file_path):
              blacklist = set()
              
              if not os.path.exists(file_path):
                  print(f"Kara liste dosyası bulunamadı: {file_path}")
                  print("Kara liste olmadan devam ediliyor...")
                  return blacklist
              
              try:
                  with open(file_path, 'r', encoding='utf-8') as f:
                      for line in f:
                          line = line.strip()
                          if not line or line.startswith('#'):
                              continue
                          
                          domain = line.replace('https://', '').replace('http://', '').replace('www.', '').strip('/')
                          blacklist.add(domain)
                          print(f"  Kara listeye eklendi: {domain}")
              
              except Exception as e:
                  print(f"Kara liste dosyası okuma hatası: {e}")
                  print("Kara liste olmadan devam ediliyor...")
              
              return blacklist

          def is_blacklisted(url, blacklist):
              if not blacklist:
                  return False
              
              try:
                  parsed = urlparse(url)
                  domain = parsed.netloc.replace('www.', '')
                  return domain in blacklist
              except:
                  return False

          def get_final_url(url, blacklist=None, timeout=10):
              try:
                  url = url.strip().rstrip('/')
                  
                  if blacklist and is_blacklisted(url, blacklist):
                      print(f"  ⛔ Kara listede, atlanıyor: {url}")
                      return None
                  
                  response = scraper.get(
                      url,
                      allow_redirects=True,
                      timeout=timeout,
                      headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}
                  )
                  
                  final_url = response.url.rstrip('/')
                  
                  if blacklist and is_blacklisted(final_url, blacklist):
                      print(f"  ⛔ Redirect sonucu kara listede: {final_url}")
                      print(f"  ✓ Mevcut URL korunuyor")
                      return url
                  
                  parsed = urlparse(final_url)
                  clean_url = f"{parsed.scheme}://{parsed.netloc}"
                  
                  return clean_url
                  
              except Exception as e:
                  print(f"  Hata ({url}): {str(e)}")
                  return None

          def parse_line(line):
              match = re.match(r'\|([^:]+):(https?://[^\s]+)', line.strip())
              if match:
                  name = match.group(1)
                  url = match.group(2).rstrip('/')
                  return name, url
              return None, None

          file_path = '${{ env.FILE_PATH }}'
          blacklist_path = '${{ env.BLACKLIST_PATH }}'
          
          print("Kara liste kontrol ediliyor...")
          blacklist = load_blacklist(blacklist_path)
          if blacklist:
              print(f"Toplam {len(blacklist)} domain kara listede.\n")
          else:
              print("Kara liste bulunamadı veya boş.\n")
          
          try:
              with open(file_path, 'r', encoding='utf-8') as f:
                  content = f.read()
          except FileNotFoundError:
              print(f"Dosya bulunamadı: {file_path}")
              exit(1)

          original_content = content
          changes_made = False

          print("Domain kontrolleri başlıyor...\n")

          lines = content.splitlines()
          
          for i, line in enumerate(lines):
              if not line.strip() or not line.strip().startswith('|'):
                  continue
          
              name, original_url = parse_line(line)
          
              if not name or not original_url:
                  continue
          
              print(f"Kontrol ediliyor: {name}")
              print(f"  Mevcut URL: {original_url}")
              
              final_url = get_final_url(original_url, blacklist)
          
              if final_url and final_url != original_url:
                  print(f"  ✓ Yeni URL bulundu: {final_url}")
                  old_line = line
                  new_line = f"|{name}:{final_url}"
                  content = content.replace(old_line, new_line, 1)
                  changes_made = True
              else:
                  if final_url:
                      print(f"  → Değişiklik yok")
                  else:
                      print(f"  ✗ Erişilemedi veya kara listede, mevcut URL korunuyor")
          
              print()

          if changes_made and content != original_content:
              with open(file_path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print("✓ Dosya güncellendi!")
          else:
              print("→ Güncelleme gerekmedi.")

          EOF

      - name: Değişiklikleri kaydet
        run: |
          git config user.name 'Domain Updater'
          git config user.email 'bot@github-actions'
          
          git add ${{ env.FILE_PATH }}

          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor"
            exit 0
          fi

          CURRENT_TIME=$(date +'%Y-%m-%d %H:%M')
          git commit -m "🔄 Domain updated - $CURRENT_TIME"
          git push
